{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Dorehami{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}" />
  </head>
  <body class="min-h-screen bg-stone-50 text-stone-900">
    <header class="border-b border-stone-200 bg-white">
      <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-4">
        <a href="{% url 'home' %}" class="text-lg font-semibold">Dorehami</a>
        <nav class="flex items-center gap-4 text-sm">
          {% if user.is_authenticated %}
            <span>{{ user.name }}</span>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="underline">Log out</button>
            </form>
          {% else %}
            <a href="{% url 'login' %}" class="underline">Sign in</a>
            <a href="{% url 'signup' %}" class="underline">Sign up</a>
          {% endif %}
        </nav>
      </div>
    </header>
    <main class="mx-auto max-w-3xl px-4 py-8">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
