{% extends "base.html" %}{% block title %}ثبت‌نام | دورهمی{% endblock %}{% block content %}<section class="auth-card"><p class="eyebrow">شروع ساده</p><h1>حساب بسازید</h1><p class="muted">در چند ثانیه برای هماهنگی دورهمی آماده شوید.</p><form method="post" class="form-stack">{% csrf_token %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<label>ایمیل{{ form.email }}{{ form.email.errors }}</label><label>نام شما{{ form.name }}{{ form.name.errors }}</label><label>رمز عبور{{ form.password }}{{ form.password.errors }}</label>{{ form.non_field_errors }}<button class="button" type="submit">ساخت حساب</button></form><p class="muted center">حساب دارید؟ <a href="{% url 'login' %}{% if next %}?next={{ next|urlencode }}{% endif %}">وارد شوید</a></p></section>{% endblock %}
