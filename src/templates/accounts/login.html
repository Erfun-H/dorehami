{% extends "base.html" %}{% block title %}ورود | دورهمی{% endblock %}{% block content %}<section class="auth-card"><p class="eyebrow">خوش آمدید</p><h1>وارد دورهمی شوید</h1><p class="muted">برای دیدن دعوت و برنامه‌ریزی با دوستانتان وارد شوید.</p><form method="post" class="form-stack">{% csrf_token %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<label>ایمیل{{ form.email }}{{ form.email.errors }}</label><label>رمز عبور{{ form.password }}{{ form.password.errors }}</label>{{ form.non_field_errors }}<button class="button" type="submit">ورود</button></form><p class="muted center">حساب ندارید؟ <a href="{% url 'signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}">ثبت‌نام کنید</a></p></section>{% endblock %}
